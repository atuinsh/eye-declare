[package]
name = "eye_declare_next"
description = "Timeline/Elm inline TUI layer (v2 redesign, working name — see .planning/REDESIGN.md)"
repository = "https://github.com/BinaryMuse/eye-declare"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
crossterm = "0.29"
eye_declare_engine = { path = "../eye_declare_engine" }
futures-core = "0.3"
ratatui-core = "0.1"
ratatui-widgets = "0.3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"], optional = true }
unicode-segmentation = "1"
unicode-width = "0.2"

[features]
default = ["tokio"]
# The tokio driver (driver_tokio::run). The core stays executor-agnostic;
# disable for sync-only apps with zero async dependencies.
tokio = ["dep:tokio", "crossterm/event-stream"]

[dev-dependencies]
eye_declare_engine = { path = "../eye_declare_engine", features = ["test-util"] }
futures = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
