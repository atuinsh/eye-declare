[package]
name = "eye_declare_engine"
description = "Inline terminal rendering engine: frame diffing, ANSI escape generation, scrollback-aware output"
repository = "https://github.com/BinaryMuse/eye-declare"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
ratatui-core = "0.1"
ratatui-widgets = { version = "0.3", features = [
  "unstable-rendered-line-info",
] }
unicode-width = "0.2"
