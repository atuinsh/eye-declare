[package]
name = "eye_declare_engine"
description = "Inline terminal rendering engine: frame diffing, ANSI escape generation, scrollback-aware output"
repository = "https://github.com/atuinsh/eye-declare"
version = "0.6.4"
edition = "2024"
license = "MIT"

[dependencies]
ratatui-core = "0.1"
ratatui-widgets = { version = "0.3", features = [
  "unstable-rendered-line-info",
] }
unicode-width = "0.2"
vte = { version = "0.15.0", optional = true }

[features]
# VTE-backed TestTerminal for snapshot-testing engine output.
test-util = ["dep:vte"]

[dev-dependencies]
# Self-dependency to switch test-util on for this crate's own tests, so
# `cargo test --workspace` runs the TestTerminal behavior suite without
# needing a feature flag.
eye_declare_engine = { path = ".", features = ["test-util"] }
